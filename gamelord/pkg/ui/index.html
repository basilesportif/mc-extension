<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gamelord</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Arial", sans-serif;
        background: url("https://i.imgur.com/tazsUO9.png") no-repeat center
          center fixed;
        background-size: cover;
        color: #ffffff;
        text-align: center;
      }
      h1 {
        font-size: 4em;
        margin-top: 10vh;
        letter-spacing: 0.1em;
        color: #ffffff;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      }
      .tabs {
        display: flex;
        justify-content: center;
        margin-top: 20px;
      }
      .tab {
        padding: 10px 20px;
        cursor: pointer;
        background-color: rgba(0, 0, 0, 0.5);
        border: 1px solid #ffffff;
        border-radius: 5px 5px 0 0;
        margin: 0 5px;
      }
      .tab-content {
        display: none;
        padding: 20px;
        background-color: rgba(0, 0, 0, 0.5);
        border: 1px solid #ffffff;
        border-radius: 0 5px 5px 5px;
      }
      .tab-content.active {
        display: block;
      }
      .container {
        display: flex;
        justify-content: space-around;
        margin-top: 5vh;
      }
      .option {
        padding: 20px;
        border-radius: 5px;
        background-color: rgba(0, 0, 0, 0.5);
        width: 40%;
      }
      .form-group {
        margin: 20px 0;
      }
      input[type="text"],
      input[type="file"] {
        padding: 10px;
        font-size: 1em;
        width: 80%;
        max-width: 400px;
        border: none;
        border-radius: 5px;
        margin-bottom: 10px;
        color: #333;
        background-color: #ffffff;
      }
      button {
        padding: 10px 20px;
        font-size: 1em;
        background-color: rgba(255, 69, 0, 0.8);
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin: 5px;
      }
      button:hover {
        background-color: rgba(224, 62, 0, 0.8);
      }
      .disclaimer {
        margin-top: 20px;
        font-size: 0.9em;
        color: #ffffff;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <h1>Gamelord</h1>
    <div class="tabs">
      <div class="tab" onclick="showTab('tab1')">Gamelord</div>
      <div class="tab" onclick="showTab('tab2')">Lobby Manager</div>
    </div>
    <div id="tab1" class="tab-content active">
      <div class="container">
        <div class="option">
          <h2>Add Player to Game</h2>
          <form id="playerForm">
            <div class="form-group">
              <input
                type="text"
                id="minecraftName"
                name="minecraftName"
                placeholder="Enter Minecraft Name"
              />
            </div>
            <div class="form-group">
              <input
                type="text"
                id="kinode_id"
                name="kinode_id"
                placeholder="Enter Kinode ID"
              />
            </div>
            <button type="button" onclick="addPlayer()">Submit Details</button>
          </form>
        </div>
        <div class="option">
          <h2>Load Preconfigured World</h2>
          <form>
            <div class="form-group">
              <input type="file" id="fileInput" accept=".json" />
            </div>
            <button type="button" onclick="uploadFile()">Upload File</button>
          </form>
        </div>
      </div>
      <div class="container">
        <div class="option">
          <h2>Delete World</h2>
          <button type="button" onclick="deleteWorld()">Delete World</button>
        </div>
        <div class="option">
          <h2>Get World Configuration</h2>
          <button type="button" onclick="getWorldConfig()">
            Get World Config
          </button>
        </div>
      </div>
      <pre id="response-output-tab1"></pre>
    </div>
    <div id="tab2" class="tab-content">
      <div class="container">
        <div class="option">
          <h2>Edit Lobby</h2>
          <form id="editLobbyForm">
            <div class="form-group">
              <input
                type="text"
                id="lobbyName"
                name="lobbyName"
                placeholder="Enter Lobby Name"
              />
            </div>
            <div class="form-group">
              <input
                type="text"
                id="minecraftServerAddress"
                name="minecraftServerAddress"
                placeholder="Enter Minecraft Server Address"
              />
            </div>
            <div class="form-group">
              <input
                type="text"
                id="team1"
                name="team1"
                placeholder="Should show Team1 members"
              />
            </div>
            <div class="form-group">
              <input
                type="text"
                id="team2"
                name="team2"
                placeholder="Should show Team2 members"
              />
              <div class="form-group">
                <label for="clearTeams">
                  <input type="checkbox" id="clearTeams" name="clearTeams" />
                  Clear Teams
                </label>
              </div>
            </div>
            <button type="button" onclick="editLobby()">Submit Changes</button>
          </form>
        </div>
      </div>
      <div class="container"></div>
      <pre id="response-output-tab2"></pre>
    </div>
    <script>
      function showTab(tabId) {
        const tabs = document.querySelectorAll(".tab-content");
        tabs.forEach((tab) => {
          tab.classList.remove("active");
        });
        document.getElementById(tabId).classList.add("active");
      }

      document.addEventListener("DOMContentLoaded", () => {
        document
          .getElementById("playerForm")
          .addEventListener("submit", addPlayer);
      });

      async function addPlayer() {
        const minecraftName = document.getElementById("minecraftName").value;
        const kinode_id = document.getElementById("kinode_id").value;
        const playerData = {
          kinode_id: kinode_id,
          minecraft_player_name: minecraftName,
        };

        const url =
          "http://localhost:8080/gamelord:gamelord:basilesex.os/api/addPlayer"; // Adjust the URL as needed

        try {
          const response = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(playerData),
          });

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const data = await response.text();
          console.log("Player added successfully:", data);
          document.getElementById(
            "response-output-tab1"
          ).innerText = `Player ${minecraftName} with ID ${kinode_id} added successfully.`;
        } catch (error) {
          console.error("Error adding player:", error);
          document.getElementById(
            "response-output-tab1"
          ).innerText = `Error: ${error.message}`;
        }
      }

      function uploadFile() {
        const fileInput = document.getElementById("fileInput");
        const file = fileInput.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = async (e) => {
            const text = e.target.result;
            try {
              const jsonData = JSON.parse(text);
              const url =
                "http://localhost:8080/gamelord:gamelord:basilesex.os/api/loadWorld";
              const response = await fetch(url, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify(jsonData),
              });

              if (response.ok) {
                console.log("JSON uploaded successfully.");
                document.getElementById("response-output-tab1").innerText =
                  "JSON uploaded successfully.";
              } else {
                throw new Error("Failed to upload JSON");
              }
            } catch (error) {
              console.error("Error reading or sending file:", error);
              document.getElementById(
                "response-output-tab1"
              ).innerText = `Error: ${error.message}`;
            }
          };
          reader.readAsText(file);
        } else {
          console.log("No file selected.");
          document.getElementById("response-output-tab1").innerText =
            "No file selected.";
        }
      }

      function deleteWorld() {
        const url =
          "http://localhost:8080/gamelord:gamelord:basilesex.os/api/deleteWorld"; // Adjust the URL as needed

        fetch(url, {
          method: "POST",
        })
          .then((response) => {
            if (response.ok) {
              console.log("World deleted successfully.");
              document.getElementById("response-output-tab1").innerText =
                "World deleted successfully.";
            } else {
              throw new Error("Failed to delete world");
            }
          })
          .catch((error) => {
            console.error("Error deleting world:", error);
            document.getElementById(
              "response-output-tab1"
            ).innerText = `Error: ${error.message}`;
          });
      }

      function getWorldConfig() {
        const url =
          "http://localhost:8080/gamelord:gamelord:basilesex.os/world_config"; // Adjust the URL as needed

        fetch(url, {
          method: "GET",
        })
          .then((response) => {
            if (response.ok) {
              return response.json();
            } else {
              throw new Error("Failed to get world configuration");
            }
          })
          .then((data) => {
            console.log("World configuration:", data);
            document.getElementById("response-output-tab1").innerText =
              JSON.stringify(data, null, 2);
          })
          .catch((error) => {
            console.error("Error getting world configuration:", error);
            document.getElementById(
              "response-output-tab1"
            ).innerText = `Error: ${error.message}`;
          });
      }

      function editLobby() {
        const lobbyName = document.getElementById("lobbyName").value;
        const minecraftServerAddress = document.getElementById(
          "minecraftServerAddress"
        ).value;
        const clearTeams = document.getElementById("clearTeams").checked;

        const url =
          "http://localhost:8080/gamelord:gamelord:basilesex.os/api/editLobby";

        const data = {
          name: lobbyName,
          minecraft_server_address: minecraftServerAddress,
          clear_teams: clearTeams,
        };
        console.log(data);

        fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
        })
          .then((response) => {
            if (response.ok) {
              return response.text();
            } else {
              throw new Error("Failed to edit lobby");
            }
          })
          .then((result) => {
            console.log("Lobby edited successfully:", result);
            document.getElementById("response-output-tab2").innerText = result;
          })
          .catch((error) => {
            console.error("Error editing lobby:", error);
            document.getElementById(
              "response-output-tab2"
            ).innerText = `Error: ${error.message}`;
          });
      }
    </script>
  </body>
</html>
