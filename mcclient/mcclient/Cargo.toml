[package]
name = "mcclient"
version = "0.1.0"
edition = "2021"

[dependencies]
mcstructs = {path = "../../mcstructs"}
anyhow = "1.0"
bincode = "1.3.3"
kinode_process_lib = { git = "https://github.com/kinode-dao/process_lib", tag = "v0.8.5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.120"
wit-bindgen = "0.24.0"
lazy_static = "1.4"
[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "kinode:process"
