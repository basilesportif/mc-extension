<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>McClient</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Arial", sans-serif;
        background: url("https://i.ytimg.com/vi/exWJRPFHTAY/maxresdefault.jpg")
          no-repeat center center fixed;
        background-size: cover;
        color: #ffffff;
        text-align: center;
      }
      h1 {
        font-size: 4em;
        margin-top: 10vh;
        letter-spacing: 0.1em;
        color: #ffffff;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      }
      .container {
        display: flex;
        justify-content: space-around;
        margin-top: 5vh;
      }
      .option {
        padding: 20px;
        border-radius: 5px;
        background-color: rgba(0, 0, 0, 0.5);
        width: 40%;
      }
      .form-group {
        margin: 20px 0;
      }
      input[type="text"],
      input[type="file"] {
        padding: 10px;
        font-size: 1em;
        width: 80%;
        max-width: 400px;
        border: none;
        border-radius: 5px;
        margin-bottom: 10px;
        color: #333;
        background-color: #ffffff;
      }
      button {
        padding: 10px 20px;
        font-size: 1em;
        background-color: rgba(255, 69, 0, 0.8);
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin: 5px;
      }
      button:hover {
        background-color: rgba(224, 62, 0, 0.8);
      }
      .disclaimer {
        margin-top: 20px;
        font-size: 0.9em;
        color: #ffffff;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <h1>McClient</h1>
    <h2>Join Team</h2>
    <form id="playerForm">
      <input
        type="text"
        id="gamelordId"
        placeholder="Enter Gamelord NodeId, e.g. gamelordd.os"
      />
      <input
        type="text"
        id="minecraftId"
        placeholder="Enter Your Minecraft ID"
      />
      <button type="button" onclick="joinTeam('Team1')">Join Team1</button>
      <button type="button" onclick="joinTeam('Team2')">Join Team2</button>
    </form>
    <pre id="response-output"></pre>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("playerForm");
      });

      async function joinTeam(team_name) {
        console.log("join team");
        const minecraft_id = document.getElementById("minecraftId").value;
        const gamelord_id = document.getElementById("gamelordId").value;

        const host =
          window.location.port === "5173"
            ? "localhost:8080"
            : window.location.host;
        const url = `http://${host}/mcclient:mcclient:basilesex.os/join_team`;

        try {
          const response = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              gamelord_id: gamelord_id,
              minecraft_id: minecraft_id,
              team_name: team_name,
            }),
          });

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const data = await response.text();
          document.getElementById(
            "response-output"
          ).innerText = `${minecraft_id} join request made.`;
        } catch (error) {
          console.error("Error adding player:", error);
          document.getElementById(
            "response-output"
          ).innerText = `Error: ${error.message}`;
        }
      }
    </script>
  </body>
</html>
